name: Portability package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      revision:
        description: Full merged commit SHA to build and verify
        required: true
        type: string
      publish:
        description: Publish the verified immutable artifacts after installed checks
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.plan.outputs.revision }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Check publication refusal and recovery
        run: |
          controls="$RUNNER_TEMP/portability-release-tests"
          mkdir "$controls"
          cp -R scripts tests_release "$controls/"
          cd "$controls"
          uv run --no-project --with pytest python -m pytest -q tests_release
      - name: Select exact source
        id: plan
        env:
          SELECTED_REVISION: ${{ inputs.revision || github.sha }}
        run: |
          flags=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then flags+=(--qualification); fi
          python scripts/release.py plan --revision "$SELECTED_REVISION" "${flags[@]}" --output "$GITHUB_OUTPUT"
      - name: Build and seal the selected standalone artifacts
        env:
          SELECTED_REVISION: ${{ steps.plan.outputs.revision }}
        run: |
          mkdir "$RUNNER_TEMP/portability-source"
          git archive "$SELECTED_REVISION" | (cd "$RUNNER_TEMP/portability-source" && tar -x)
          uv build --sdist --wheel "$RUNNER_TEMP/portability-source" --out-dir "$RUNNER_TEMP/portability-dist"
          rm -f "$RUNNER_TEMP/portability-dist/.gitignore"
          flags=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then flags+=(--qualification); fi
          python scripts/release.py seal --revision "$SELECTED_REVISION" --dist "$RUNNER_TEMP/portability-dist" "${flags[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portability-distributions
          path: ${{ runner.temp }}/portability-dist/*
          if-no-files-found: error

  installed:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portability-distributions
          path: ${{ runner.temp }}/portability-dist
      - name: Retrieve the exact qualification Worktrees artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_REVISION: ${{ needs.build.outputs.revision }}
        run: |
          git show "$SELECTED_REVISION:worktrees-source.json" > "$RUNNER_TEMP/selected-worktrees-source.json"
          dependency_tag=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["tag"])' "$RUNNER_TEMP/selected-worktrees-source.json")
          dependency_repository=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["repository"])' "$RUNNER_TEMP/selected-worktrees-source.json")
          mkdir "$RUNNER_TEMP/worktrees-dist"
          gh release download "$dependency_tag" --repo "$dependency_repository" --dir "$RUNNER_TEMP/worktrees-dist"
          cmp "$RUNNER_TEMP/selected-worktrees-source.json" "$RUNNER_TEMP/worktrees-dist/worktrees-source.json"
          python - "$RUNNER_TEMP/worktrees-dist" <<'PYCODE'
          import hashlib, json, sys
          from pathlib import Path
          dist = Path(sys.argv[1])
          receipt = json.loads((dist / "worktrees-source.json").read_bytes())
          if receipt["component"] != "worktrees":
              raise ValueError("Expected the qualification Worktrees dependency")
          names = (f"amplifier_worktrees-{receipt['version']}-py3-none-any.whl", f"amplifier_worktrees-{receipt['version']}.tar.gz")
          if set(receipt["artifacts"]) != set(names) or {p.name for p in dist.iterdir()} != {*names, "worktrees-source.json", "SHA256SUMS"}:
              raise ValueError("Unexpected Worktrees artifact set")
          for name in names:
              raw = (dist / name).read_bytes()
              if {"sha256": hashlib.sha256(raw).hexdigest(), "bytes": len(raw)} != receipt["artifacts"][name]:
                  raise ValueError("Worktrees bytes differ from the selected receipt")
          sums = "".join(f"{hashlib.sha256((dist / name).read_bytes()).hexdigest()}  {name}\n" for name in (*names, "worktrees-source.json"))
          if (dist / "SHA256SUMS").read_text() != sums:
              raise ValueError("Worktrees checksums differ")
          PYCODE
      - name: Verify and test the installed wheel outside the source checkout
        env:
          SELECTED_REVISION: ${{ needs.build.outputs.revision }}
          SELECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          flags=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then flags+=(--qualification); fi
          python scripts/release.py verify --revision "$SELECTED_REVISION" --dist "$RUNNER_TEMP/portability-dist" "${flags[@]}"
          uv venv --python "${{ matrix.python }}" "$RUNNER_TEMP/portability-installed"
          python_path="$RUNNER_TEMP/portability-installed/bin/python"
          if [ "$RUNNER_OS" = Windows ]; then python_path="$RUNNER_TEMP/portability-installed/Scripts/python.exe"; fi
          uv pip install --python "$python_path" "$RUNNER_TEMP/portability-dist/amplifier_portability-$SELECTED_VERSION-py3-none-any.whl" pytest==9.1.1 "$RUNNER_TEMP"/worktrees-dist/*.whl
          mkdir "$RUNNER_TEMP/portability-tests"
          git archive "$SELECTED_REVISION" tests pyproject.toml | (cd "$RUNNER_TEMP/portability-tests" && tar -x)
          cd "$RUNNER_TEMP/portability-tests"
          "$python_path" -I -c 'from pathlib import Path; import sys, amplifier_portability, amplifier_worktrees; assert all(Path(p.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()) for p in (amplifier_portability, amplifier_worktrees)); assert not any(name in sys.modules for name in ("amplifier_web", "amplifier_core", "amplifier_foundation"))'
          # Focused artifact acceptance; the full 219-case compatibility proof is retained separately.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 "$python_path" -I -m pytest -q \
            tests/test_portability_index.py::test_recover_upgrades_json_first_receipts_without_rewriting_confirmed_history \
            tests/test_portability_index.py::test_lost_pending_table_refuses_recovery_without_mutating_database \
            tests/test_portability_index.py::test_recovery_keeps_missing_canonical_pending_write_fenced \
            tests/test_portability_index.py::test_healthy_recovery_reads_only_transient_receipts \
            tests/test_portability_protocol.py::test_two_hosts_staged_transfer_has_exactly_one_execution_owner \
            tests/test_portability_capsule.py::test_carry_dirty_preserves_staged_unstaged_untracked_and_source \
            tests/test_portability_payloads.py::test_empty_body_manifest_and_exact_put \
            --junitxml=installed-tests.xml
          uv pip check --python "$python_path"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: portability-installed-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/portability-tests/installed-tests.xml
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    needs: [build, installed]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: portability-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portability-distributions
          path: ${{ runner.temp }}/portability-dist
      - name: Publish only the original verified bytes
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_REVISION: ${{ needs.build.outputs.revision }}
        run: python scripts/release.py publish --revision "$SELECTED_REVISION" --dist "$RUNNER_TEMP/portability-dist"
