[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplifier-portability"
version = "0.1.2"
description = "Reusable Amplifier portability library"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["amplifier-worktrees==0.1.0", "cryptography>=44,<51", "filelock>=4.2.1,<5"]

[project.urls]
Repository = "https://github.com/microsoft/amplifier-portability"

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_portability"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
